<div class="px-8 container min-w-screen-lg mx-auto">
    
    <div class="w-full">
    <!-- Top Hero Video Section -->
        <div class="relative w-full h-[80vh] overflow-hidden">
            <video
            #heroVideo
            src="assets/video.mp4"
            autoplay
            muted
            loop
            playsinline
            class="w-full h-full w-object-fill"
            (mouseenter)="pauseVideo(heroVideo)"
            (mouseleave)="playVideo(heroVideo)"
            ></video>

            <!-- Optional video overlay text -->
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
            <h1 class="text-white text-4xl md:text-5xl font-bold drop-shadow-lg">
                Our Collections
            </h1>
            </div>
        </div>

        <!-- Content Section -->
        <div class="max-w-6xl mx-auto px-6 py-12">
            <h2 class="text-2xl font-semibold mb-6">Explore Our Premium Product Collections</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <div
                class="border rounded-lg p-4 shadow-sm hover:shadow-xl transition cursor-pointer"
            >
                <img src="assets/images/collection1.jpg" class="w-full rounded-lg mb-4" />
                <h3 class="text-xl font-semibold">Home Care</h3>
                <p class="text-gray-600 text-sm mt-2">
                A variety of high-quality cleaning & home care products.
                </p>
            </div>

            <div
                class="border rounded-lg p-4 shadow-sm hover:shadow-xl transition cursor-pointer"
            >
                <img src="assets/images/collection2.jpg" class="w-full rounded-lg mb-4" />
                <h3 class="text-xl font-semibold">Personal Care</h3>
                <p class="text-gray-600 text-sm mt-2">
                Explore our range of skincare & wellness products.
                </p>
            </div>

            <div
                class="border rounded-lg p-4 shadow-sm hover:shadow-xl transition cursor-pointer"
            >
                <img src="assets/images/collection3.jpg" class="w-full rounded-lg mb-4" />
                <h3 class="text-xl font-semibold">Industrial</h3>
                <p class="text-gray-600 text-sm mt-2">
                High-grade industrial chemical solutions for enterprises.
                </p>
            </div>

            </div>
        </div>
    </div>

    
    <app-product-lists></app-product-lists>
</div>
