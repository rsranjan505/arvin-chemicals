<div class="bg-green-50/50 min-h-[70vh]">
  <!-- Account hero strip -->
  <section class="bg-gradient-to-br from-green-100 via-emerald-50 to-green-200 border-b border-green-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col sm:flex-row sm:items-center gap-5">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-green-800 to-emerald-600 text-white flex items-center justify-center text-xl font-bold shadow-lg shrink-0">
        {{ initials() }}
      </div>
      <div class="flex-1">
        <h1 class="text-2xl md:text-3xl font-bold text-green-950">My Account</h1>
        <p class="text-green-700 mt-1 text-sm md:text-base">
          {{ customer()?.email }}
          <span *ngIf="customer()?.member_since" class="text-green-600"> · Member since {{ customer()?.member_since }}</span>
        </p>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="self-start sm:self-center inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-green-300 text-green-800 font-semibold text-sm hover:bg-white hover:border-red-200 hover:text-red-600 transition-all duration-200"
      >
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
        Log out
      </button>
    </div>
  </section>

  <!-- Menu + content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-10">
    <div class="lg:flex lg:gap-8">
      <!-- Side menu -->
      <nav class="mb-6 lg:mb-0 lg:w-60 shrink-0">
        <div class="flex lg:flex-col gap-1.5 overflow-x-auto bg-white lg:bg-transparent p-1.5 lg:p-0 rounded-2xl lg:rounded-none border border-green-100 lg:border-0 shadow-sm lg:shadow-none">
          <a
            routerLink="/account"
            routerLinkActive="bg-green-800 text-white shadow-md"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-gray-700 hover:text-green-900 hover:bg-green-100/70 transition-colors duration-150 whitespace-nowrap"
          >
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="w-[18px] h-[18px]"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
            Dashboard
          </a>
          <a
            routerLink="/account/orders"
            routerLinkActive="bg-green-800 text-white shadow-md"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-gray-700 hover:text-green-900 hover:bg-green-100/70 transition-colors duration-150 whitespace-nowrap"
          >
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="w-[18px] h-[18px]"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
            My Orders
          </a>
          <a
            routerLink="/account/profile"
            routerLinkActive="bg-green-800 text-white shadow-md"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-gray-700 hover:text-green-900 hover:bg-green-100/70 transition-colors duration-150 whitespace-nowrap"
          >
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="w-[18px] h-[18px]"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
            Profile
          </a>
        </div>
      </nav>

      <!-- Routed content -->
      <div class="flex-1 min-w-0">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
