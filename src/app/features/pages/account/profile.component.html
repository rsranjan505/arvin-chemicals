<div class="bg-white rounded-2xl border border-green-100 shadow-sm p-6 lg:p-8 max-w-xl">
  <h2 class="text-xl font-bold text-gray-900 mb-1">Profile Details</h2>
  <p class="text-sm text-gray-500 mb-6">Keep your account information up to date.</p>

  <div class="space-y-5">
    <!-- Email (read-only) -->
    <div>
      <label class="block text-sm font-semibold text-gray-800 mb-2">Email address</label>
      <div class="relative">
        <input
          type="email"
          [value]="customer()?.email"
          disabled
          class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-500 cursor-not-allowed"
        />
        <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[11px] font-bold uppercase tracking-wide bg-green-100 text-green-800 px-2 py-1 rounded-md">Verified</span>
      </div>
      <p class="text-xs text-gray-400 mt-1.5">Your email is your login ID and cannot be changed.</p>
    </div>

    <!-- Name -->
    <div>
      <label for="name" class="block text-sm font-semibold text-gray-800 mb-2">Full name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="name"
        placeholder="Your name"
        autocomplete="name"
        class="w-full px-4 py-3 rounded-xl bg-green-50/50 border border-green-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/15 transition-all duration-200"
      />
    </div>

    <!-- Mobile -->
    <div>
      <label for="mobile" class="block text-sm font-semibold text-gray-800 mb-2">Mobile number</label>
      <input
        id="mobile"
        type="tel"
        [(ngModel)]="mobile"
        placeholder="10-digit mobile number"
        autocomplete="tel"
        maxlength="10"
        class="w-full px-4 py-3 rounded-xl bg-green-50/50 border border-green-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/15 transition-all duration-200"
      />
    </div>

    <p *ngIf="error" class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3.5 py-2.5">{{ error }}</p>
    <p *ngIf="saved" class="text-sm text-green-700 bg-green-50 border border-green-100 rounded-lg px-3.5 py-2.5">Profile updated successfully.</p>

    <div class="flex flex-wrap gap-3 pt-1">
      <button
        type="button"
        (click)="save()"
        [disabled]="loading"
        class="inline-flex items-center gap-2 bg-gradient-to-r from-green-800 to-emerald-700 hover:from-green-700 hover:to-emerald-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold px-7 py-3 rounded-xl transition-all duration-200 shadow-lg shadow-green-900/20"
      >
        <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        {{ loading ? 'Saving…' : 'Save Changes' }}
      </button>
      <button
        type="button"
        (click)="logout()"
        class="inline-flex items-center gap-2 border-2 border-red-100 text-red-600 hover:bg-red-50 hover:border-red-200 font-semibold px-7 py-3 rounded-xl transition-all duration-200"
      >
        Log out
      </button>
    </div>
  </div>
</div>
