<section class="py-16 lg:py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <span class="inline-block text-green-700 font-semibold text-sm uppercase tracking-widest mb-2">Real Results</span>
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900">How We Helped Our Customers</h2>
      <p class="text-gray-500 mt-3 max-w-xl mx-auto">Real stories from real people on their journey to better health with ArvinPlus.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
      <div
        *ngFor="let story of stories"
        class="group bg-white rounded-2xl overflow-hidden border border-gray-100 hover:border-green-100 hover:shadow-xl transition-all duration-300 cursor-pointer"
        (click)="openModal(story)"
      >
        <a class="relative block overflow-hidden">
          <div class="aspect-[4/3] overflow-hidden bg-gray-100">
            <img *ngIf="story.image_url" [src]="story.image_url" [alt]="story.name" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
            <div *ngIf="!story.image_url" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-green-100 via-emerald-50 to-green-200">
              <svg fill="currentColor" viewBox="0 0 24 24" class="w-10 h-10 text-green-700/50 ml-1"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="absolute inset-0 bg-black/30 group-hover:bg-black/40 transition-colors flex items-center justify-center">
            <span class="w-16 h-16 rounded-full bg-white/90 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300">
              <svg fill="currentColor" viewBox="0 0 24 24" class="w-7 h-7 text-green-700 ml-1"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </div>
        </a>
        <div class="p-5">
          <h3 class="text-base font-semibold text-gray-900 leading-snug line-clamp-3">{{ story.name }}</h3>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Video Modal -->
<div
  *ngIf="selectedVideo"
  class="fixed inset-0 z-[100] flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
  <div
    class="relative w-full max-w-4xl bg-black rounded-2xl overflow-hidden shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <button
      (click)="closeModal()"
      class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-white/90 hover:bg-white flex items-center justify-center shadow-lg transition-colors"
      title="Close"
    >
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="w-5 h-5 text-gray-800">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="aspect-video w-full">
      <iframe
        [src]="selectedVideo"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        class="w-full h-full"
      ></iframe>
    </div>
    <div class="px-5 py-4 bg-white">
      <h3 class="text-base font-semibold text-gray-900 leading-snug">{{ selectedName }}</h3>
    </div>
  </div>
</div>
