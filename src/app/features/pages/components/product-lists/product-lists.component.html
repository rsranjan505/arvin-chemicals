<div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16">
  <!-- Section Header -->
  <div class="text-center mb-12">
    <span class="inline-block text-green-700 font-semibold text-sm uppercase tracking-widest mb-2">Our Products</span>
    <h2 class="text-3xl md:text-4xl font-bold text-gray-900">Premium Wellness Collection</h2>
    <p class="text-gray-500 mt-3 max-w-xl mx-auto">Scientifically formulated supplements for your health journey.</p>
  </div>

  <!-- Skeleton Loader -->
  <div *ngIf="loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
    <div *ngFor="let x of [1, 2, 3]" class="animate-pulse rounded-2xl overflow-hidden bg-white border border-gray-100">
      <div class="h-[300px] bg-gray-200"></div>
      <div class="p-5 space-y-3">
        <div class="h-5 bg-gray-200 w-2/3 rounded-lg"></div>
        <div class="h-4 bg-gray-200 w-1/2 rounded-lg"></div>
        <div class="h-4 bg-gray-200 w-1/4 rounded-lg"></div>
        <div class="h-11 bg-gray-200 w-full rounded-lg mt-4"></div>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div *ngIf="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
    <div
      *ngFor="let product of products"
      class="group bg-white rounded-2xl overflow-hidden border border-gray-100 hover:border-green-100 hover:shadow-xl transition-all duration-300 flex flex-col"
    >
      <!-- Image Section -->
      <a [routerLink]="['/products', product.slug]">
        <div class="relative w-full h-[280px] sm:h-[300px] bg-gradient-to-b from-gray-50 to-white flex items-center justify-center overflow-hidden">
          <!-- Wishlist -->
          <button class="absolute top-3 right-3 z-10 w-9 h-9 bg-white/90 backdrop-blur-sm shadow-sm rounded-full flex items-center justify-center hover:bg-white transition-colors opacity-0 group-hover:opacity-100">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="w-4 h-4 text-gray-600">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
          </button>
          <img [src]="product.img" class="h-full w-full object-contain p-6 transition-transform duration-500 group-hover:scale-110" />
        </div>
      </a>

      <!-- Details -->
      <div class="p-5 lg:p-6 flex flex-col flex-1">
        <h3 class="text-lg font-bold text-gray-900 group-hover:text-green-700 transition-colors">
          {{ product.name }}
        </h3>
        <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ product.subtitle }}</p>

        <!-- Ratings -->
        <div class="flex items-center gap-1 mt-3">
          <ng-container *ngFor="let starFilled of getStars(product.rating); let i = index">
            <span *ngIf="starFilled" class="text-amber-400 text-sm">★</span>
            <span *ngIf="!starFilled" class="text-gray-200 text-sm">★</span>
          </ng-container>
          <span class="text-xs text-gray-500 ml-1.5 font-medium">{{ product.rating }}</span>
        </div>

        <!-- Price -->
        <div class="flex items-center gap-2 mt-3">
          <span class="text-xl font-bold text-gray-900">₹{{ product.price }}</span>
          <!-- <span class="text-xs text-gray-400 line-through">₹{{ (product.price * 1.25) | number:'1.0-0' }}</span> -->
        </div>

        <!-- Action -->
        <button routerLink="/contact-us" class="w-full mt-auto pt-4">
          <span class="block w-full bg-gray-900 hover:bg-green-700 text-white text-sm font-semibold py-3 rounded-xl transition-all duration-200 hover:shadow-lg">
            Contact Us to Buy
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
