<section class="py-16 lg:py-20 bg-white text-center">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-12">
      <span class="inline-block text-green-700 font-semibold text-sm uppercase tracking-widest mb-2">Categories</span>
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900">
        Shop by Categories
      </h2>
      <p class="text-gray-500 mt-3 max-w-xl mx-auto">Explore our range of targeted wellness supplements designed for your specific health needs.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6 md:gap-8 justify-items-center">
      <div
        *ngFor="let category of categories"
        class="flex flex-col items-center gap-3 group cursor-pointer"
      >
        <div class="relative">
          <div class="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center rounded-full bg-gradient-to-br from-green-800 to-emerald-600 shadow-lg transition-all duration-300 group-hover:shadow-xl group-hover:scale-110 group-hover:from-green-700 group-hover:to-emerald-500"
            [innerHTML]="category.icon"
          ></div>
        </div>
        <p class="text-gray-800 font-semibold text-sm md:text-base leading-tight group-hover:text-green-700 transition-colors">
          {{ category.name }}
        </p>
      </div>
    </div>
  </div>
</section>
