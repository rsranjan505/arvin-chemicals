<section class="relative w-full overflow-hidden bg-gray-50">
  <div
    class="flex transition-transform duration-700 ease-in-out"
    [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
  >
    <!-- Slide 1 -->
    <div
      class="min-w-full flex flex-col md:flex-row items-center justify-between px-10 md:px-20 py-16"
    >
      <div class="text-center md:text-left space-y-6 md:w-1/2">
        <h1 class="text-4xl md:text-6xl font-bold text-green-800">
          Comprehensive Care
        </h1>
        <p class="text-lg text-green-700 max-w-md mx-auto md:mx-0">
          Elevate every aspect of wellness with the ZeroHarm range.
        </p>
        <button
          class="bg-green-800 hover:bg-green-700 text-white rounded-full px-8 py-3 mt-4 transition"
        >
          Shop Now
        </button>
      </div>
      <div class="md:w-1/2 mt-10 md:mt-0">
        <img
          src="/assets/hero1.png"
          alt="Hero Image"
          class="rounded-lg w-full"
        />
      </div>
    </div>

    <!-- Slide 2 -->
    <div
      class="min-w-full flex flex-col md:flex-row items-center justify-between px-10 md:px-20 py-16"
    >
      <div class="text-center md:text-left space-y-6 md:w-1/2">
        <h1 class="text-4xl md:text-6xl font-bold text-green-800">
          Natural Wellness
        </h1>
        <p class="text-lg text-green-700 max-w-md mx-auto md:mx-0">
          Experience nature’s purity through ZeroHarm’s bioavailable
          supplements.
        </p>
        <button
          class="bg-green-800 hover:bg-green-700 text-white rounded-full px-8 py-3 mt-4 transition"
        >
          Explore
        </button>
      </div>
      <div class="md:w-1/2 mt-10 md:mt-0">
        <img
          src="/assets/hero2.png"
          alt="Hero Image 2"
          class="rounded-lg w-full"
        />
      </div>
    </div>
  </div>

  <!-- Dots Navigation -->
  <div
    class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-2"
  >
    <button
      *ngFor="let slide of slides; let i = index"
      (click)="goToSlide(i)"
      class="w-3 h-3 rounded-full border border-green-700"
      [ngClass]="{ 'bg-green-700': currentSlide === i }"
    ></button>
  </div>

  <!-- Bottom Info Bar -->
  <div
    class="flex flex-wrap justify-center items-center text-gray-700 text-sm border-t bg-white py-3"
  >
    <div class="flex items-center space-x-2 mx-4">
      <i class="bi bi-check-circle"></i>
      <span>CLINICALLY PROVEN</span>
    </div>
    <div class="flex items-center space-x-2 mx-4">
      <i class="bi bi-heart"></i>
      <span>NO SIDE EFFECTS</span>
    </div>
    <div class="flex items-center space-x-2 mx-4">
      <i class="bi bi-droplet-half"></i>
      <span>100% BIOAVAILABLE</span>
    </div>
    <div class="flex items-center space-x-2 mx-4">
      <i class="bi bi-cpu"></i>
      <span>ADVANCED NANOTECHNOLOGY</span>
    </div>
  </div>
</section>
