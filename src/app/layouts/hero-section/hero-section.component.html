<section class="relative w-full overflow-hidden">
  <!-- SLIDER CONTAINER -->
  <div class="relative w-full h-[80vh] overflow-hidden">
    <!-- LEFT ARROW -->
    <button
      (click)="prevSlide()"
      class="absolute left-4 top-1/2 -translate-y-1/2 z-50 bg-white/40 hover:bg-white/70 text-green-900 p-3 rounded-full shadow-lg transition"
    >
      &#10094;
    </button>

    <!-- RIGHT ARROW -->
    <button
      (click)="nextSlide()"
      class="absolute right-4 top-1/2 -translate-y-1/2 z-50 bg-white/40 hover:bg-white/70 text-green-900 p-3 rounded-full shadow-lg transition"
    >
      &#10095;
    </button>

    <!-- SLIDE WRAPPER -->
    <div
      class="flex h-full transition-transform duration-700 ease-in-out"
      [style.transform]="'translateX(-' + currentIndex * 100 + 'vw)'"
    >
      <!-- EACH SLIDE -->
      <div
        *ngFor="let slide of slides"
        class="w-screen h-full flex-shrink-0 relative"
      >
        <!-- BACKGROUND IMAGE -->
        <img [src]="slide.image" class="w-full h-full object-cover" />

        <!-- DARK OVERLAY -->
        <!-- <div class="absolute inset-0 bg-black bg-opacity-20"></div> -->

        <!-- SLIDE CONTENT -->
        <div
          class="absolute inset-0 flex flex-col justify-center items-center px-10 lg:px-28 text-white"
        >
          <h1 class="text-4xl md:text-6xl font-bold drop-shadow-lg">
            {{ slide.title }}
          </h1>
          <p class="text-lg md:text-2xl mt-4 max-w-2xl drop-shadow-lg">
            {{ slide.subtitle }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- INDICATORS -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-3 z-50">
    <div
      *ngFor="let slide of slides; let i = index"
      class="w-3 h-3 rounded-full transition-all duration-300"
      [class.bg-green-800]="i === currentIndex"
      [class.bg-white]="i !== currentIndex"
    ></div>
  </div>
</section>
