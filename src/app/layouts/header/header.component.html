<!-- Top Announcement Bar -->
<div class="bg-gradient-to-r from-green-900 via-green-800 to-emerald-700 text-white text-center text-xs sm:text-sm py-2.5 px-4 tracking-wide">
  <span class="font-medium">FREE SHIPPING</span> on orders above ₹999 &nbsp;|&nbsp; <span class="font-medium">AYUSH</span> approved supplements
</div>

<header class="py-3 lg:py-4 bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100/50">
  <div class="flex justify-between items-center px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
    <!-- Left: Logo -->
    <a routerLink="/" class="flex items-center gap-2">
      <span class="text-xl sm:text-2xl lg:text-3xl font-bold text-green-900 tracking-tight"
        >ARVIN PLUS<sup class="text-[10px] text-green-600">TM</sup></span
      >
    </a>

    <!-- Center: Navigation -->
    <nav class="hidden lg:flex items-center gap-1 text-gray-600">
      <a
        routerLink="/home"
        routerLinkActive="text-green-900 font-semibold"
        [routerLinkActiveOptions]="{exact:true}"
        class="px-4 py-2 rounded-lg hover:text-green-900 hover:bg-green-50 font-medium text-sm transition-all duration-200"
        >Home</a
      >

      <a
        routerLink="/our-collections"
        routerLinkActive="text-green-900 font-semibold"
        class="px-4 py-2 rounded-lg hover:text-green-900 hover:bg-green-50 font-medium text-sm transition-all duration-200"
        >Our Products</a
      >
      <a
        routerLink="/blog"
        routerLinkActive="text-green-900 font-semibold"
        class="px-4 py-2 rounded-lg hover:text-green-900 hover:bg-green-50 font-medium text-sm transition-all duration-200"
        >Blog</a
      >
      <a
        routerLink="/about-us"
        routerLinkActive="text-green-900 font-semibold"
        class="px-4 py-2 rounded-lg hover:text-green-900 hover:bg-green-50 font-medium text-sm transition-all duration-200"
        >About Us</a
      >
      <a
        routerLink="/contact-us"
        routerLinkActive="text-green-900 font-semibold"
        class="px-4 py-2 rounded-lg hover:text-green-900 hover:bg-green-50 font-medium text-sm transition-all duration-200"
        >Contact Us</a
      >
    </nav>

    <div class="flex items-center gap-2">
      <a routerLink="/cart" class="relative p-2.5 rounded-full text-green-800 hover:bg-green-50 transition-colors duration-200" title="Cart">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
        </svg>
        <span *ngIf="cartCount > 0" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-bold flex items-center justify-center">{{ cartCount }}</span>
      </a>

      <div class="relative hidden md:block">
        <input
          *ngIf="searchOpen"
          type="text"
          placeholder="Search products..."
          (click)="$event.stopPropagation()"
          class="absolute right-12 top-1/2 -translate-y-1/2 w-0 opacity-0 transition-all duration-300 ease-in-out px-4 py-2 rounded-full bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent shadow-sm"
          [ngClass]="{
            'w-64 opacity-100 px-4': searchOpen
          }"
        />
        <button
          class="p-2.5 rounded-full text-green-800 hover:bg-green-50 transition-colors duration-200"
          (click)="toggleSearch()"
        >
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z"></path>
          </svg>
        </button>
      </div>

      <button class="lg:hidden p-2.5 rounded-full text-green-800 hover:bg-green-50 transition-colors duration-200" (click)="toggleMenu()">
        <i class="text-xl" [ngClass]="['bi', mobileOpen ? 'bi-x-lg' : 'bi-list']"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="mobileOpen" class="lg:hidden" (click)="closeMenu()">
    <div class="bg-white border-t border-gray-100 shadow-lg" (click)="$event.stopPropagation()">
      <nav class="px-4 py-3 flex flex-col gap-1 text-gray-700">
        <a routerLink="/home" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">Home</a>
        <!-- <a routerLink="/products" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">Products</a> -->
        <a routerLink="/our-collections" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">Our Products</a>
        <a routerLink="/blog" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">Blog</a>
        <a routerLink="/about-us" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">About Us</a>
        <a routerLink="/contact-us" class="px-3 py-2.5 rounded-lg hover:bg-green-50 hover:text-green-900 font-medium text-sm transition-colors" (click)="closeMenu()">Contact Us</a>
      </nav>
    </div>
  </div>
</header>
