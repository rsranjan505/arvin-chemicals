<app-top-nav></app-top-nav>

<header
  class="w-full bg-white shadow-sm z-50 sticky top-0 h-max-[58px] h-[58px]"
>
  <div
    class="max-w-screen-xl mx-2 sm:mx-auto flex justify-between items-center"
  >
    <!-- Left Section: Logo + Menu -->
    <div class="flex items-center space-x-4">
      <a routerLink="/" class="cursor-pointer">
        <img
          src="assets/logo/ar24-bihar-logo.png"
          alt="AR24 Bihar News"
          class="md:h-[100px] -mt-[10px] h-[75px]"
        />
      </a>
      <div
        class="hidden md:flex space-x-6 items-center text-md md:ml-15 md:-mt-[30px]"
      >
        <a
          routerLink="/"
          routerLinkActive="font-semibold text-red-700 border-b-2"
          [routerLinkActiveOptions]="{ exact: true }"
          class="hover:text-red-800 cursor-pointer"
          >होम</a
        >
        <!-- बिहार Dropdown -->
        <div class="relative" (click)="toggleDropdown('bihar')">
          <button
            class="flex items-center gap-1"
            [ngClass]="{ 'font-semibold text-red-700 border-b-2': iSbiharLink }"
          >
            बिहार
            <svg
              class="w-3 h-3 transition-transform"
              [class.rotate-180]="dropdownOpen.bihar"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                d="M5.23 7.21a.75.75 0 011.06.02L10 11.04l3.71-3.81a.75.75 0 011.08 1.04l-4.25 4.36a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
              />
            </svg>
          </button>
          <div
            *ngIf="dropdownOpen.bihar"
            class="absolute top-full mt-2 bg-white rounded shadow-2xl w-60 z-10"
          >
            <ul>
              <li
                *ngFor="let cat of categories"
                class="px-4 py-2 hover:bg-red-100 cursor-pointer"
                [routerLinkActive]="'bg-red-200 font-semibold'"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a [routerLink]="['/bihar/', cat.hindi_slug]">
                  {{ cat.hi }}
                </a>
              </li>
            </ul>
          </div>
        </div>

        <a
          class="hover:text-red-800 cursor-pointer"
          routerLink="/bihar/rajanata-oura-shasana"
          routerLinkActive="font-semibold text-red-700 border-b-2"
           [routerLinkActiveOptions]="{ exact: true }"
        >
          राजनीति और शासन</a
        >
        <a
          routerLink="/bihar/manarajana-oura-sanama"
          routerLinkActive="font-semibold text-red-700 border-b-2"
          class="hover:text-red-800 cursor-pointer"
          [routerLinkActiveOptions]="{ exact: true }"
          >मनोरंजन और सिनेमा</a
        >
      </div>
    </div>

    <!-- Right Section: Icons -->
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-4 text-md md:-mt-[30px]">
        <button
          class="relative items-center py-1.5 text-xs font-bold uppercase hidden md:block rounded-full shadow-md bg-red-700 text-white text-md px-2"
        >
          HN
          <!-- <svg
            class="w-3 h-3 ml-1"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 20 20"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 9l-7 7-7-7"
            />
          </svg> -->
        </button>

        <!-- Bell Icon -->
        <app-notification></app-notification>

        <!-- LIVE Tag -->
        <a
          routerLink="live/videos-news"
          routerLinkActive="font-semibold text-white-700"
          class="px-1"
        >
          <span
            class="relative flex items-center md:px-3 p-1 py-1.5 text-xs font-bold uppercase"
          >
            <span class="absolute flex w-3 h-3 left-1 top-1">
              <span
                class="absolute inline-flex w-full h-full bg-red-400 rounded-full opacity-75 animate-ping"
              ></span>

              <span
                class="relative inline-flex w-10 h-3 bg-red-900 rounded-full"
              ></span>
            </span>
            <img
              src="assets/live.png"
              alt="live"
              class="w-10 h-7 shadow-md md:p-1 p-0 text-white text-md rounded-full"
            />
          </span>
        </a>

        <!-- Search Icon -->
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="red"
          stroke-width="2"
          viewBox="0 0 24 24"
          (click)="openSearch()"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z"
          />
        </svg>
        <!-- <app-search
          *ngIf="showSearch"
          (close)="closeSearch()"
          (searchChange)="handleSearch($event)"
        ></app-search> -->

        <!-- Contact Icon -->
        <!-- <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2 5.5C2 4.12 3.12 3 4.5 3h15C20.88 3 22 4.12 22 5.5v13c0 1.38-1.12 2.5-2.5 2.5h-15C3.12 21 2 19.88 2 18.5v-13zM6 10h12M6 14h8" />
        </svg> -->
      </div>

      <!-- Mobile Toggle -->
      <button class="md:hidden ml-2" (click)="toggleMobile()">
        <svg
          *ngIf="!isMobileOpen"
          class="h-6 w-6 text-red-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          *ngIf="isMobileOpen"
          class="h-6 w-6 text-red-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="isMobileOpen"
    @dropdownAnimation
    class="md:hidden px-4 pb-4 bg-shadow-100 bg-red-100 border-t -mt-[8px] text-md shadow-lg rounded-md p-2 z-50"
  >
    <div class="space-y-4 text-sm pt-2 font-bold">
      <a
        routerLink="/"
        class="block px-4 py-1 rounded"
        (click)="closeMobileMenu()"
        >होम</a
      >

      <div>
        <button
          (click)="toggleMobileDropdownu()"
          class="w-full text-left px-4 py-2 flex justify-between items-center hover:bg-gray-100"
        >
          बिहार
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <div *ngIf="isMobileDropdownuOpen" class="pl-6">
          <ul>
            <li
              *ngFor="let cat of categories"
              class="px-4 py-2 hover:bg-red-100 cursor-pointer"
              [routerLinkActive]="'bg-red-200 font-semibold'"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <a
                [routerLink]="['/bihar/', cat.hindi_slug]"
                (click)="closeMobileMenu()"
              >
                {{ cat.hi }}
              </a>
            </li>
          </ul>
        </div>
      </div>

      <a routerLink="/bihar/rajanata-oura-shasana" class="block px-4 py-1 rounded">राजनीति और शासन</a>

      <a
       routerLink="/bihar/manarajana-oura-sanama"
        class="block px-4 py-1 rounded"
        (click)="closeMobileMenu()"
        >मनोरंजन और सिनेमा</a
      >
      <!-- <a
        routerLink="/dharma"
        class="block px-4 py-1 rounded"
        (click)="closeMobileMenu()"
        >धर्म</a
      > -->

      <a
        routerLink="/about"
        class="block px-4 py-1 rounded"
        (click)="closeMobileMenu()"
        >परिचय</a
      >
      <a
        routerLink="/contact"
        class="block px-4 py-1 rounded"
        (click)="closeMobileMenu()"
        >संपर्क</a
      >
    </div>
  </div>
</header>
