<header class="py-4 shadow-sm bg-white sticky top-0 z-50">
  <div
    class="flex justify-between items-center px-8 w-screen-md mx-auto container"
  >
    <!-- Left: Logo -->
    <div class="flex items-center space-x-3">
      <img src="/assets/logo.png" alt="Logo" class="h-10 w-auto" />
      <span class="text-xl font-semibold text-gray-700">ARVIN+</span>
    </div>

    <!-- Center: Navigation -->
    <nav class="hidden md:flex space-x-10 text-gray-700">
      <!-- Shop Dropdown -->
      <div class="relative group">
        <button
          class="flex items-center space-x-1 hover:text-green-600 transition"
        >
          <span>Shop</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 8.25l-7.5 7.5-7.5-7.5"
            />
          </svg>
        </button>
        <div
          class="absolute left-0 top-full hidden group-hover:flex bg-white border shadow-lg mt-2 rounded-lg w-[600px] p-6 space-x-10 animate-slideIn"
        >
          <div class="w-1/3 border-r pr-4">
            <ul class="space-y-3 text-gray-700">
              <li class="hover:text-green-600 cursor-pointer">Vitamins</li>
              <li class="hover:text-green-600 cursor-pointer">Minerals</li>
              <li class="hover:text-green-600 cursor-pointer">Therapeutics</li>
              <li class="hover:text-green-600 cursor-pointer">Combos</li>
            </ul>
          </div>
          <div class="flex-1 grid grid-cols-2 gap-6">
            <div
              class="flex items-center space-x-3 hover:bg-gray-50 p-2 rounded-md cursor-pointer"
            >
              <span class="text-green-600 text-2xl">♂️</span>
              <span>Multi Vitamins For Men</span>
            </div>
            <div
              class="flex items-center space-x-3 hover:bg-gray-50 p-2 rounded-md cursor-pointer"
            >
              <span class="text-green-600 text-2xl">♀️</span>
              <span>Multi Vitamins For Women</span>
            </div>
            <div
              class="flex items-center space-x-3 hover:bg-gray-50 p-2 rounded-md cursor-pointer"
            >
              <span class="text-green-600 text-2xl">🧬</span>
              <span>Biotin</span>
            </div>
            <div
              class="flex items-center space-x-3 hover:bg-gray-50 p-2 rounded-md cursor-pointer"
            >
              <span class="text-green-600 text-2xl">💊</span>
              <span>B Complex</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Ingredients Link -->
      <a routerLink="/ingredients" class="hover:text-green-600">Ingredients</a>

      <!-- Resources Dropdown -->
      <div class="relative group">
        <button
          class="flex items-center space-x-1 hover:text-green-600 transition"
        >
          <span>Resources</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 8.25l-7.5 7.5-7.5-7.5"
            />
          </svg>
        </button>
        <div
          class="absolute left-0 top-full hidden group-hover:flex bg-white border shadow-lg mt-2 rounded-lg w-[400px] p-6 space-x-10 animate-slideIn"
        >
          <div class="flex w-full justify-around">
            <div
              class="flex flex-col items-center space-y-2 cursor-pointer hover:text-green-600"
            >
              <span class="text-green-700 text-3xl">📰</span>
              <span class="font-medium">Blogs</span>
            </div>
            <div
              class="flex flex-col items-center space-y-2 cursor-pointer hover:text-green-600"
            >
              <span class="text-green-700 text-3xl">📊</span>
              <span class="font-medium">BMI Calculator</span>
            </div>
          </div>
        </div>
      </div>

      <a routerLink="/new-arrivals" class="hover:text-green-600"
        >New Arrivals</a
      >
    </nav>

    <!-- Right: Icons -->
    <div class="flex items-center space-x-6">
      <button
        class="hidden md:block border border-green-600 px-4 py-2 rounded-md text-green-600 hover:bg-green-50 transition"
      >
        Track your order
      </button>
      <button class="text-gray-700 hover:text-green-600">
        <i class="bi bi-search text-xl"></i>
      </button>
      <button class="text-gray-700 hover:text-green-600">
        <i class="bi bi-person text-xl"></i>
      </button>
      <button class="text-gray-700 hover:text-green-600 relative">
        <i class="bi bi-bag text-xl"></i>
        <span
          class="absolute -top-2 -right-2 bg-green-600 text-white text-xs rounded-full px-1.5"
          >2</span
        >
      </button>
      <button class="md:hidden" (click)="toggleMenu()">
        <i
          class="bi"
          [ngClass]="mobileOpen ? 'bi-x-lg' : 'bi-list'"
          class="text-2xl"
        ></i>
      </button>
    </div>
  </div>
</header>
