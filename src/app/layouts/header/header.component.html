<header class="py-4 shadow-sm bg-white sticky top-0 z-50">
  <div
    class="flex justify-between items-center px-8 w-screen-md mx-auto container"
  >
    <!-- Left: Logo -->
    <div class="flex items-center space-x-3">
      <!-- <img src="/assets/logo.png" alt="Logo" class="h-10 w-auto" /> -->
      <span class="md:text-3xl sm:text-2xl font-bold text-green-900 tracking-wider">ARVIN PLUS<sup>TM</sup></span>
    </div>

    <!-- Center: Navigation -->
    <nav class="hidden md:flex space-x-10 text-gray-700">
      <a routerLink="/home" class="hover:text-green-900" routerLinkActive="text-green-900 text-bold">Home</a>
      <!-- Shop Dropdown -->
      <div class="relative group">
        <button
          class="flex items-center space-x-1 hover:text-green-900 transition"
        >
          <span>Products</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 8.25l-7.5 7.5-7.5-7.5"
            />
          </svg>
        </button>
        <div
          class="absolute left-0 top-full hidden group-hover:flex bg-white border shadow-lg mt-2 rounded-lg w-[200px] p-6 space-x-10 animate-slideIn"
        >

            <ul class="space-y-3 text-gray-700 ">
              <li class="hover:text-green-900 cursor-pointer">Vitamins</li>
              <li class="hover:text-green-900 cursor-pointer">Minerals</li>
              <li class="hover:text-green-900 cursor-pointer">Therapeutics</li>
              <li class="hover:text-green-900 cursor-pointer">Combos</li>
            </ul>

        </div>
      </div>

      <a routerLink="/our-collections" routerLinkActive="text-green-900 text-bold " class="hover:text-green-900">Our Collections</a>

      <a routerLink="/about-us" routerLinkActive="text-green-700" class="hover:text-green-900">About Us</a>
      <a routerLink="/contact-us" routerLinkActive="text-green-900" class="hover:text-green-900">Contact Us</a>
    </nav>

    <div class="flex items-center space-x-2">
      <div class="relative">
  <!-- Floating Search Input (absolute) -->
  <input
    *ngIf="searchOpen"
    type="text"
    placeholder="Search..."
    (click)="$event.stopPropagation()"
    class="
      absolute right-14 top-1/2 -translate-y-1/2
      w-0 opacity-0 
      transition-all duration-300 ease-in-out
      px-4 py-2 rounded-full bg-white shadow-lg
      border border-gray-300 text-sm z-50
    "
    [ngClass]="{
      'w-64 opacity-100': searchOpen
    }"
  />
      <button class="hidden md:block px-4 py-2 rounded-md text-green-900 hover:bg-green-50 transition" (click)="toggleSearch()">
        <svg _ngcontent-ng-c599621487="" fill="none" stroke="darkgreen" stroke-width="2" viewBox="0 0 24 24" class="w-6 h-6 ng-tns-c599621487-0"><path _ngcontent-ng-c599621487="" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z" class="ng-tns-c599621487-0"></path></svg>
      </button>
      </div>
      
      <button class="text-gray-700 hover:text-green-900 hover:bg-green-50 transition">

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g stroke="darkgreen" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <circle cx="12" cy="8" r="3.2" fill="none"/>

            <path d="M4.5 20c0-3.5 3.6-6.2 7.5-6.2s7.5 2.7 7.5 6.2" fill="none"/>
          </g>
        </svg>
      </button>
      <button class="text-gray-700 hover:text-green-900 relative hover:bg-green-50 transition">

        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
          <!-- Cart -->
          <g stroke="darkgreen" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8h4l3 16h16l3-10H10" fill="none"/>
            <circle cx="16" cy="30" r="2.4" fill="none"/>
            <circle cx="28" cy="30" r="2.4" fill="none"/>
          </g>

          <circle cx="30" cy="10" r="7" fill="darkgreen"/>
          <text x="30" y="13" font-size="10" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">3</text>
        </svg>
      </button>
      <button class="md:hidden" (click)="toggleMenu()">
        <i
          class="text-2xl text-green-900"
          [ngClass]="['bi', mobileOpen ? 'bi-x-lg' : 'bi-list']"
        ></i>
      </button>
    </div>
  </div>


  <!-- Mobile Menu -->
<!-- BACKDROP (click outside closes menu) -->
  <div *ngIf="mobileOpen"
    class="md:hidden z-90"
    (click)="closeMenu()">

    <!-- MOBILE MENU PANEL -->
    <div
      class="bg-white w-full border-t border-gray-200 animate-slide-down"
      (click)="$event.stopPropagation()">
      <nav class="px-4 py-4 flex flex-col gap-4 text-gray-700">
        <a routerLink="/home" class="hover:text-green-900" (click)="closeMenu()">Home</a>
        <a routerLink="/products" class="hover:text-green-900" (click)="closeMenu()">Products</a>
        <a routerLink="/our-collections" class="hover:text-green-900" (click)="closeMenu()">Our Collections</a>
        <a routerLink="/about-us" class="hover:text-green-900" (click)="closeMenu()">About</a>
        <a routerLink="/contact-us" class="hover:text-green-900" (click)="closeMenu()">Contact</a>
      </nav>
    </div>
  </div>
</header>
